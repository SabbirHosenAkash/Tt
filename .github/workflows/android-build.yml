name: Android Build and APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle-wrapper.properties'
      - 'gradlew'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle/**'
      - 'app/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android project
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle wrapper ./gradlew not found. Import the complete Android source first."
            exit 1
          fi
          chmod +x ./gradlew
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::No Gradle settings file at repository root. Adjust workflow if project is in a subfolder."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests when available
        shell: bash
        run: |
          if ./gradlew tasks --all | grep -q 'testDebugUnitTest'; then
            ./gradlew --no-daemon testDebugUnitTest
          else
            echo "No testDebugUnitTest task detected; no unit test task found."
          fi

      - name: Prepare APK and checksum
        shell: bash
        run: |
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK found after assembleDebug."
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/PRILINA-debug-${{ github.run_number }}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRILINA-debug-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: PRILINA Debug Build ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Automated debug APK from main.
            Commit: ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Debug build only; not production-signed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
